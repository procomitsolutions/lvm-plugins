# ServiceAccount con permisos mínimos para leer pods/logs y gestionar un Deployment concreto.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: app-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: app-ns
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["web"]             # solo ese Deployment
  verbs: ["get", "patch", "update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  resourceNames: ["web"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: app-ns
subjects:
- kind: ServiceAccount
  name: deployer
  namespace: app-ns
roleRef:                             # inmutable
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
# Verificar:
#   kubectl auth can-i patch deployment/web -n app-ns --as=system:serviceaccount:app-ns:deployer
#   kubectl auth can-i get secrets -n app-ns --as=system:serviceaccount:app-ns:deployer   # debe ser "no"
