# StatefulSet con headless Service, PVC por réplica y PDB.
# Reemplazar: db, app-ns, imagen, puertos, StorageClass y tamaños.
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: app-ns
  labels:
    app.kubernetes.io/name: db
spec:
  clusterIP: None                    # headless: DNS estable por pod (db-0.db-headless.app-ns.svc.cluster.local)
  publishNotReadyAddresses: true     # permite que los miembros se descubran antes de estar Ready
  selector:
    app.kubernetes.io/name: db
  ports:
  - name: db
    port: 5432
    targetPort: db
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: app-ns
spec:
  selector:
    app.kubernetes.io/name: db
  ports:
  - name: db
    port: 5432
    targetPort: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: app-ns
spec:
  serviceName: db-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0                   # súbelo para canary por ordinal
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain              # conservar datos al borrar el StatefulSet
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: db
      containers:
      - name: db
        image: registry.example.com/db:16.4
        ports:
        - name: db
          containerPort: 5432
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 1Gi
        readinessProbe:
          tcpSocket: {port: db}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: db}
          initialDelaySeconds: 30
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: data
          mountPath: /var/lib/db
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd     # con volumeBindingMode: WaitForFirstConsumer
      resources:
        requests:
          storage: 20Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: db
  namespace: app-ns
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
