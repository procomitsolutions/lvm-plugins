# .github/ISSUE_TEMPLATE/bug.yml
name: Reporte de bug
description: Algo no funciona como debería
title: "[Bug]: "
labels: ["bug", "triage"]
type: Bug              # issue type de la org (quitar si la org no los usa)
body:
  - type: markdown
    attributes:
      value: Gracias por reportar. Revisa que no exista un issue igual.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Comportamiento actual y esperado
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      options: [Producción, Staging, Local]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: v1.2.3
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmación
      options:
        - label: Quité datos sensibles de los logs
          required: true
